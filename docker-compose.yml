services:
  postgres:
    image: postgres:18-alpine
    container_name: orchestrator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # Loopback only — this is a developer database, not a LAN service.
      - "127.0.0.1:5434:5432"
    volumes:
      # postgres:18+ moved PGDATA to /var/lib/postgresql/18/docker and declares
      # VOLUME /var/lib/postgresql — mounting the old .../data target would put
      # the cluster OUTSIDE the volume and lose it on the next recreate.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - orchestrator-network

volumes:
  postgres_data:
    driver: local

networks:
  orchestrator-network:
    driver: bridge
