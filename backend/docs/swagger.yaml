      - ApiKeyAuth: []
      summary: Get a node's device profile state
      tags:
      - nodes
    put:
      consumes:
      - application/json
      description: 'Stores the node''s own hardware declaration: carrier profile,
        factory variant, and which module sits in which port. Validated against the
        registry (unknown ids, module/port fit, bus and I2C-address conflicts, board
        compatibility) and REFUSED on any violation — a stored equipage must always
        render a safe config.txt. An empty profile_id clears the declaration; the
        node then follows OU/account inheritance. Assignment stores only: nothing
        reaches the device until an explicit apply.'
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: string
      - description: Equipage (empty profile_id clears)
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_node.deviceProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Resulting state
