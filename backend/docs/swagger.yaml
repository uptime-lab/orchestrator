      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_login.UserLoginCommand'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful (single account)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.AuthResult'
              type: object
        "202":
          description: Account selection required (data=results.LoginChallengeResult);
            with a second factor owed the 202 carries results.TwoFactorChallengeResult
            and message two_factor_required instead — its two_factor_methods lists
            totp (finish via /auth/2fa) and/or passkey (finish via the ordinary passkey
            login). A registered passkey counts as an enrolled factor for members
            of an account that requires two factors.
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.LoginChallengeResult'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Invalid credentials
