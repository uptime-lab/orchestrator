      - description: Image ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Compression started
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
