  /api/v1/images/{id}/upload:
    post:
      consumes:
      - multipart/form-data
      description: 'Uploads a file for an OS image (allowed extensions: .img, .iso,
        .xz, .zst). The file is stored atomically and the FileStorageInfo field (path,
        original name, size) plus the SHA256 checksum are updated. Re-uploading replaces
        the old file only after the new one is stored. Two limits apply: a per-image
        size cap, and the account''s remaining storage quota — a file within the per-image
        cap is still refused when the account has less room left than the file needs
        (413), and an account or instance with no room left at all is refused at admission,
        before the body is read, as 409 image_quota — the same code the post-body
        accounting answers when the real byte count no longer fits. Re-uploading into
        this record does not count its current file against the quota, since the upload
        replaces it.'
      parameters:
      - description: Image ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: File uploaded successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.ImageResult'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "404":
          description: Image not found (checked before the body is read)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: 'The image is busy: an upload or a compression is already in
            progress; or no storage room left (code image_quota) — delete an image
            to free space'
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.FileTooLargeResult'
        "429":
          description: 'No upload slot free (code upload_capacity): the server or
            this account is at its concurrent-upload bound — wait and retry'
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Upload file for image
      tags:
      - images
