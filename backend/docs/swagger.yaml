              type: object
        "400":
          description: Validation error (no file, already compressed, xz unavailable)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "404":
