            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
      summary: Log out
      tags:
      - auth
  /auth/oidc/callback:
    get:
      description: The IdP redirects here. Verifies state and nonce against the cookies
        /auth/oidc/start set, resolves the identity to a session, and redirects to
        the SPA carrying a one-time handoff code — never the tokens themselves, which
        the SPA trades for at /auth/oidc/complete. Failures redirect with an error
        parameter rather than answering with a status, because the caller is a browser
        mid-redirect.
      parameters:
      - description: CSRF state, must match the cookie
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code from the IdP
        in: query
        name: code
        required: true
        type: string
      responses:
        "302":
          description: Redirect to the SPA with a one-time handoff code
          schema:
            type: string
      summary: Identity-provider callback
      tags:
      - auth
  /auth/oidc/complete:
    post:
      consumes:
      - application/json
      description: Trades the one-time handoff code from the callback redirect for
        the login result. Answers 200 with a token pair when the identity resolves
        to a single account, or 202 with an account-selection challenge when it resolves
        to several — the same discriminated shape a password login uses. The code
        is single-use and short-lived, and is redeemable only together with the httpOnly
        binding cookie the callback set in the same browser; a same-origin request
        sends it without any client code.
      parameters:
      - description: Handoff code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_oidc.completeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.AuthResult'
              type: object
        "202":
          description: Account selection required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.LoginChallengeResult'
              type: object
        "400":
          description: Code is required
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Invalid or expired login code
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Complete federated login
      tags:
      - auth
  /auth/oidc/config:
    get:
      description: 'Reports that federated login is configured on this instance: the
        provider''s display name (empty when none is configured and the issuer is
        not Google), its issuer URL, whether an unknown identity can create an account
        (sign_up: open — open registration, or OIDC_AUTO_PROVISION with no invite
        code; invite_code; or closed), and a legacy English button label. The route
        exists only when a provider was discovered at startup, so a 404 means OIDC
        is off.'
      produces:
      - application/json
      responses:
        "200":
          description: OIDC is available
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: OIDC availability
      tags:
      - auth
  /auth/oidc/identities:
    get:
      description: Live links only — an identity that was unlinked is not listed,
        and is not counted as a credential.
      produces:
      - application/json
      responses:
        "200":
          description: Linked identities
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_oidc.identityResult'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: List my external identities
      tags:
      - authz
  /auth/oidc/identities/{id}:
    delete:
      description: 'Detaches a federated sign-in from the current account. Refused
        with 409 when it is the last way the user could sign in — the remaining set
        counts password, passkeys and other linked identities, and deliberately NOT
        TOTP, which is a second factor and cannot start a session. The removal is
        a soft delete: an operator can restore it, the user cannot, so re-linking
        means going through the provider again.'
      parameters:
      - description: External identity id, from GET /auth/oidc/identities
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Malformed identity id
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "404":
          description: No such identity for this user
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: This is the last remaining sign-in method
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Unlink one of my external identities
      tags:
      - authz
  /auth/oidc/link:
    post:
      description: Requires a step-up confirmation, because the identity it attaches
        is a way to sign in that outlives a password change, a passkey rotation, a
        TOTP enrolment and a session revocation. Send the ticket in X-Reauth-Ticket,
        or expect 403 with code reauth_required. A user whose only credential is the
        IdP makes that proof at /auth/oidc/reauth.
      parameters:
      - description: Step-up confirmation ticket
        in: header
        name: X-Reauth-Ticket
        type: string
      responses:
        "200":
          description: Link started
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "403":
          description: Step-up confirmation required (code reauth_required)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Start linking an external identity
      tags:
      - authz
  /auth/oidc/link-existing:
    post:
      consumes:
      - application/json
      parameters:
      - description: One-time link code and the account password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_oidc.linkExistingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Linked and logged in
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.AuthResult'
              type: object
        "202":
          description: Account selection required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.LoginChallengeResult'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Invalid code or password
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "429":
          description: Too many failed attempts for this address (code login_throttled,
            Retry-After header)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Link a pending external identity to an existing account by password
      tags:
      - authz
  /auth/oidc/reauth:
    post:
      description: Starts a proof-of-presence round trip for a user whose only credential
        is their IdP account. Sets a short-lived httpOnly cookie, then the SPA navigates
        to /auth/oidc/start; the provider is asked to re-authenticate the person rather
        than answer from an existing session. On return the SPA exchanges the one-time
        code from /account?oidc_reauth=<code> for a confirmation ticket.
      produces:
      - application/json
      responses:
        "200":
          description: Step-up started
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "503":
          description: Step-up not available
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Begin step-up re-authentication with the identity provider
      tags:
      - auth
  /auth/oidc/reauth/complete:
    post:
      consumes:
      - application/json
      description: 'Exchanges the one-time code the IdP round trip returned for a
        short-lived confirmation ticket. Bound to the user who started the flow: another
        user''s code is not accepted. Send the ticket back in the X-Reauth-Ticket
        header.'
      parameters:
      - description: One-time code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_oidc.stepUpCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Confirmation ticket
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "401":
          description: Invalid or expired code
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Finish step-up re-authentication
      tags:
      - auth
  /auth/oidc/start:
    get:
      description: 'Redirects the browser to the identity provider. Not callable by
        an API client: the state and nonce live in httpOnly cookies that only this
        redirect sets, and the callback rejects a response without them.'
      parameters:
      - description: Invite code, carried across the IdP round-trip; required to provision
          a NEW account when the instance is invite-gated
        in: query
        name: invite
        type: string
      responses:
        "302":
          description: Redirect to the identity provider
          schema:
            type: string
        "500":
          description: Could not start the login flow
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Begin federated login
      tags:
      - auth
  /auth/passkey/begin:
    post:
      description: 'Returns WebAuthn request options for navigator.credentials.get(),
        plus a single-use ticket. No user is named: the authenticator resolves which
        account to offer, which is what makes this a full sign-in rather than a second
        factor.'
      produces:
      - application/json
      responses:
        "200":
          description: Request options and ticket
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Begin passkey login
      tags:
      - auth
  /auth/passkey/finish:
    post:
      consumes:
      - application/json
      description: 'Verifies the authenticator''s assertion and answers exactly like
        /auth/login: 200 with tokens, or 202 with the account-selection challenge
        for a multi-account user.'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.AuthResult'
              type: object
        "202":
          description: Account selection required
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.LoginChallengeResult'
              type: object
        "401":
          description: Verification failed
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "410":
          description: The request expired
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Finish passkey login
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the access token using a valid refresh token. The account
        stays pinned; a revoked or disabled membership is rejected with a machine-readable
        401.
      parameters:
      - description: Token refresh data
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_login_refresh.UserLoginRefreshCommand'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens refreshed successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.TokenRefreshResult'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Invalid or expired refresh token, or membership revoked/disabled
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Consumes a one-time reset token and installs the new password.
        Signs out every other session by invalidating refresh tokens issued before
        the reset, and marks the address verified. The token is single-use.
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_password_reset.confirmBody'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: Token was issued for a different address
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Set a new password from a reset link
      tags:
      - auth
  /auth/select-account:
    post:
      consumes:
      - application/json
      description: Exchanges the pre-auth token returned by /auth/login for a token
        pair pinned to the chosen account. The token is single-use, expires five minutes
        after the login, and is refused after a password change made since it was
        issued — a fresh login is then required.
      parameters:
      - description: Pre-auth token and account ID
        in: body
        name: selection
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_user.selectAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account selected
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.AuthResult'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Invalid pre-auth token or membership
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Select an account after login
      tags:
      - auth
  /auth/sessions:
    get:
      description: Every live login for the signed-in user — one entry per session,
        however many times its token has rotated — newest activity first. The entry
        for the requesting session is marked `current`.
      produces:
      - application/json
      responses:
        "200":
          description: Live sessions
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_user.SessionResult'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: List my sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Revokes a single session by id, including every token rotated out
        of it. Revoking the current session is allowed — it is how "sign out of this
        browser from another device" works.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: No such live session
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Revoke one of my sessions
      tags:
      - auth
  /auth/sessions/revoke-others:
    post:
      description: Revokes every session except the one making the request. The "I
        lost a device" action; the caller stays signed in on purpose.
      produces:
      - application/json
      responses:
        "200":
          description: Other sessions revoked
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
      security:
      - ApiKeyAuth: []
      summary: Sign out of my other sessions
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account with email and password
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_register.RegisterCommand'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.AuthResult'
              type: object
        "202":
          description: 'Open registration: confirm the address from the mail, then
            sign in. No session; the same answer whether or not the address already
            had an account (nothing is mailed then)'
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_user.SignupPendingResult'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "403":
          description: 'Registration is closed (code registration_closed): the instance
            has accounts and neither open registration nor an invite code is configured,
            its account ceiling is reached, or the count could not be read; the first
            owner of an empty instance needs no code, and neither does any sign-up
            while open registration is on. Decided before the address is looked up,
            so it is the answer whether or not the address is registered (as is 400
            for a wrong invite code)'
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: User already exists (only to a caller admitted to register
            on the first-owner or invite-code path; never on the open path)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "429":
          description: 'Open registration: too many sign-ups are waiting for confirmation
            (code registration_busy), or the per-IP limit; try again later'
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/switch-account:
    post:
      consumes:
      - application/json
      description: Mints a token pair pinned to another account the current user is
        an active member of
      parameters:
      - description: Target account ID
        in: body
        name: target
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_user.switchAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account switched
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.TokenRefreshResult'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized, session no longer active, or not a member
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Switch to another account
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Consumes a one-time verification token from an email link and marks
        the address as verified. Idempotent for an already-verified user; the token
        itself is single-use.
      parameters:
      - description: Verification token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_email_verification.confirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: Token was issued for a different address
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Confirm an email address
      tags:
      - auth
  /capture/{id}:
    put:
      consumes:
      - application/octet-stream
      description: Streams a zstd-compressed disk image captured on a node into image
        storage and finalizes the pending image record. Authenticated by the HMAC
        signature in the query string, not a JWT.
      parameters:
      - description: Image ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Capability expiry (unix seconds)
        in: query
        name: exp
        required: true
        type: string
      - description: Capability HMAC signature
        in: query
        name: sig
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Capture stored
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.ImageResult'
              type: object
        "403":
          description: Invalid or expired signature
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "404":
          description: Image not found
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "413":
          description: Capture too large
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "429":
          description: Per-IP rate limit exceeded
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      summary: Upload a captured disk image (agent, signed capability)
      tags:
      - images
  /cdn/{path}:
    get:
      consumes:
      - application/json
      description: Serves a file from the platform's storage backend (local filesystem
        or S3-compatible object storage). The path parameter captures everything after
        /cdn/
      parameters:
      - description: File path (everything after /cdn/)
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: File not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Serve file from CDN
      tags:
      - cdn
  /cdn/agent-versions:
    get:
      description: 'Lists agent package versions available for install, and the concrete
        version the `latest` alias installs. `latest_by_arch` answers that per architecture
        (arm64, amd64): the version recorded when a release import moved that architecture''s
        `latest`, else the newest version listed for it. `latest` is the arm64 answer
        (omitted when unknown). Compare a node against its architecture''s answer,
        not against the top of the list, which can be a version imported without moving
        `latest`, or one imported for the other architecture only.'
      produces:
      - application/json
      responses:
        "200":
          description: Available versions and what latest installs
          schema:
            $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_cdn.AgentVersionsResponse'
      summary: List available agent versions
      tags:
      - cdn
  /cdn/agent/{version}/{arch}/{pkgType}:
    get:
      consumes:
      - application/json
      description: 'Serves orchestrator agent packages (deb, rpm, tar.gz) by version,
        architecture, and package type. Files are stored in a flat structure with
        the pattern: orchestrator-agent_{version}_linux_{arch}.{ext}. The "latest"
        version is treated as a literal string, not resolved to the highest version.'
      parameters:
      - description: Version (semantic version like 1.2.3 or 'latest')
        example: 1.2.3
        in: path
        name: version
        required: true
        type: string
      - description: Architecture
        enum:
        - amd64
        - arm64
        example: arm64
        in: path
        name: arch
        required: true
        type: string
      - description: Package type
        enum:
        - deb
        - rpm
        - tar.gz
        example: deb
        in: path
        name: pkgType
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Agent package file
          schema:
            type: file
        "400":
          description: Bad request (invalid version, arch, or package type)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Agent package not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download agent package
      tags:
      - cdn
  /cdn/watcher/{version}/{arch}/{pkgType}:
    get:
      consumes:
      - application/json
      description: Serves the telemetry-only watcher agent packages by version, architecture,
        and package type. Same flat naming as the full agent with the orchestrator-watcher
        prefix; "latest" is a literal.
      parameters:
      - description: Version (semantic version like 1.2.3 or 'latest')
        example: 1.2.3
        in: path
        name: version
        required: true
        type: string
      - description: Architecture
        enum:
        - amd64
        - arm64
        example: arm64
        in: path
        name: arch
        required: true
        type: string
      - description: Package type
        enum:
        - deb
        - rpm
        - tar.gz
        example: deb
        in: path
        name: pkgType
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Watcher package file
          schema:
            type: file
        "400":
          description: Bad request (invalid version, arch, or package type)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Watcher package not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download Watcher (watcher) agent package
      tags:
      - cdn
  /health:
    get:
      description: Static liveness answer. It deliberately checks NOTHING — this is
        what a container healthcheck polls, and restarting the backend repairs neither
        a dead database nor a full disk, so a dependency check here would turn an
        outage into a restart loop. Ask /ready whether the instance can actually serve.
      produces:
      - application/json
      responses:
        "200":
          description: Always, while the process is running
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness
      tags:
      - health
  /install.sh:
    get:
      description: 'Shell script that installs the agent and adopts the device: `curl
        -fsSL https://<platform>/install.sh | sudo ORCHESTRATOR_TOKEN=''<adoption-token>''
        sh`. The token is the base64 adoption blob (per-node adoption file or master-token
        adoption file) and is self-contained; the script never receives credentials
        from the server. `--token-file <path>` reads the token from a root-only file
        instead, so it is not on a command line. A one-time code (ac_...) is exchanged
        only after the package is installed, and a second run of the same code on
        a device that already exchanged it finishes with the adoption file written
        then. Exit statuses are listed in the script''s header.'
      produces:
      - text/plain
      responses:
        "200":
          description: shell script
          schema:
            type: string
      summary: One-command agent installer script
      tags:
      - server
  /ready:
    get:
      description: 'Whether this instance can serve requests that touch its dependencies:
        a database ping plus free bytes AND free inodes on the storage path (replaced
        by a bucket reachability check when images live in object storage, because
        a statfs of a disk nothing writes to passes while every upload fails). Public
        and unauthenticated on purpose — an external uptime probe holds no token —
        and the body names which dependency is unhappy, never why. Cached for a few
        seconds.'
      produces:
      - application/json
      responses:
        "200":
          description: Ready
          schema:
            additionalProperties: true
            type: object
        "503":
          description: A dependency is unhappy
          schema:
            additionalProperties: true
            type: object
      summary: Readiness
      tags:
      - health
  /source/:
    get:
      description: 'Plain-text listing of the corresponding-source bundle for the
        recovery image this install distributes (GPLv2 section 3, equivalent access).
        One line per file: name, size in bytes and the SHA-256 digest read from the
        `SHA256SUMS` placed beside the files (`-` when the file is not listed there).
        Public and tokenless on purpose: the offer is owed to whoever received the
        image. An install that publishes no offer answers 404 with a plain-text body.'
      produces:
      - text/plain
      responses:
        "200":
          description: 'one file per line: name, size, sha256'
          schema:
            type: string
        "404":
          description: this install serves no corresponding-source offer
          schema:
            type: string
        "429":
          description: rate limit exceeded
          schema:
            type: string
      summary: 'Corresponding-source offer: list the published files'
      tags:
      - server
  /source/{name}:
    get:
      description: 'Serves one file of the corresponding-source offer as an inert
        attachment (`application/octet-stream`, `nosniff`), with Range requests supported
        so a multi-hundred-megabyte archive can be resumed. The name is a bare file
        name: a path separator or `..` is refused as not found, and only a regular
        file in the offer directory is served. Public and tokenless, as the listing
        is.'
      parameters:
      - description: file name as shown by the listing
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: the file
          schema:
            type: file
        "206":
          description: the requested byte range
          schema:
            type: file
        "404":
          description: no such file, or this install serves no corresponding-source
            offer
          schema:
            type: string
        "429":
          description: rate limit exceeded
          schema:
            type: string
      summary: 'Corresponding-source offer: download one file'
      tags:
      - server
  /uninstall.sh:
    get:
      description: 'Shell script that removes the orchestrator agent and everything
        it wrote from a device: `curl -fsSL https://<platform>/uninstall.sh | sudo
        sh`. It disarms the watchdog FIRST (an armed watchdog whose liveness file
        goes stale reboots the machine), then stops and purges the package and its
        state. SSH access artifacts are left alone unless `--purge-access` is given,
        and that is refused if it would remove the last way in.'
      produces:
      - text/plain
      responses:
        "200":
          description: shell script
          schema:
            type: string
      summary: Agent uninstall script
      tags:
      - server
swagger: "2.0"
