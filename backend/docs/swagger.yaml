  /api/v1/nodes/ssh-adopt:
    post:
      consumes:
      - application/json
      description: 'Installs the agent on a reachable device over SSH, registers a
        node, waits for it to connect and (optionally) flashes a network-first EEPROM.
        Returns a job immediately; poll GET /node-adoption-jobs/:id or subscribe to
        WebSocket "node_adoption_job_updated" for progress. Installing the agent and
        flashing the EEPROM reboot the device and can be destructive. For a device
        that is not registered yet, only node_name is required: default_username/default_password
        are that node''s OPTIONAL console login, not the credentials this adoption
        connects with, and managed access comes from access entries once the agent
        reports in. The adoption never accepts a host key on first use: send exactly
        one of host_key_ticket (the value a reachable preflight returned within the
        last 15 minutes, bound to your account, user, host, port and the key the preflight
        saw) or host_key_fingerprint (the device''s SHA256 host key, known out of
        band). The connection is then strict against that key and a different key
        fails before any credential is offered. Neither, an expired ticket, or a ticket
        issued for another host, port, account or user is refused with 400 (code host_key_binding_required)
        before any connection; run the preflight again and adopt with its ticket.
        Adoptions are bounded to four per server and two per account; one more is
        refused with 429 (code adoption_capacity) and creates no job.'
      parameters:
      - description: SSH adoption parameters
        in: body
        name: adopt
        required: true
        schema:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_ssh_adopt.SSHAdoptCommand'
      produces:
      - application/json
      responses:
        "202":
          description: Adoption job started
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.NodeAdoptionJobResult'
              type: object
        "400":
          description: Validation error, or host_key_binding_required (no ticket or
            fingerprint, or a ticket that does not verify for this request)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: 'Refused before any job starts: the install is at its device
            cap (code device_cap_reached), or the account at its own device limit
            (code account_device_limit_reached; data: limit, account_devices, plan,
            until for a dated subscription, contact)'
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "429":
          description: No adoption slot free for this server or this account (adoption_capacity);
            wait and retry
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "503":
          description: 'The device cap could not be checked (code device_cap_unverified):
            nothing was written; try again'
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Adopt a device over SSH
      tags:
      - nodes
  /api/v1/nodes/ssh-preflight:
    post:
      consumes:
      - application/json
      description: 'Non-destructively probes a reachable device over SSH: verifies
        connectivity + auth, captures the host-key fingerprint (SHA256), and reports
        architecture, sudo mode and whether the device can reach the agent CDN. Writes
        nothing and does not reboot. Use before committing to adoption. A reachable
        probe also returns host_key_ticket (valid 15 minutes, until host_key_ticket_expires_at;
        a backend restart invalidates it too), the proof the adoption must present
        as host_key_ticket. A probe with no expected_host_key_fingerprint takes the
        key on first use and answers first_contact=true. Send expected_host_key_fingerprint
        (a value an earlier preflight reported) to check the device still presents
        that key: a different key answers 200 with host_key_changed=true, both fingerprints
        and no ticket, and the handshake stops before any credential is offered. To
        accept a device''s new key after a reinstall, repeat the probe with the same
        expectation and accept_new_host_key=true: the result then carries host_key_reset=true,
        a ticket for the new key, and the audit trail records both fingerprints. A
        server with host_key_policy=strict refuses a probe without an expectation
        (400, code host_key_fingerprint_required). Probes are bounded to eight per
        server and four per account; one more is refused with 429 (code preflight_capacity)
        before any lookup or connection.'
      parameters:
      - description: SSH connection parameters
        in: body
        name: preflight
        required: true
        schema:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_ssh_preflight.SSHPreflightCommand'
      produces:
      - application/json
      responses:
        "200":
          description: Preflight results
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.SSHPreflightResult'
              type: object
        "400":
          description: Validation error, policy refusal, or host_key_fingerprint_required
            on a strict server
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "429":
          description: No connection-test slot free for this server or this account
            (preflight_capacity); wait and retry
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Preflight an SSH device adoption
      tags:
      - nodes
