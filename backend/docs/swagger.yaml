    type: object
  pkg_webapp_infrastructure_http_server_handlers_workflow.SetTemplateOURequest:
    properties:
      ou_id:
        description: |-
          OUID is the legacy single-unit field; OUIDs supersedes it and wins when
          both are present. An explicit empty ou_ids clears the scope, which ou_id
          alone cannot express distinctly from "not supplied".
        type: string
      ou_ids:
        items:
          type: string
        type: array
    type: object
info:
  contact: {}
paths:
  /api/v1/access-entries:
    get:
      description: Lists entries directly attached to an OU (ou_id), a node (node_id),
        or the account (scope=account).
      parameters:
      - description: Organizational unit id
        in: query
        name: ou_id
        type: string
      - description: Node id
        in: query
        name: node_id
        type: string
      - description: Set to 'account' for account-default entries, 'unassigned' for
          entries not applied to any node, or 'all' for every entry regardless of
          scope
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
