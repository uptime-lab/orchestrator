      description: Starts background compression of an uploaded image file to the
        deploy format — multi-block xz (zstd fallback). Raw files (.img/.iso) are
        compressed; .zst uploads and single-block .xz uploads are repacked (multi-block
        xz decompresses in parallel on devices). By default the original file is KEPT
        in storage and referenced via file_storage_info.source_file_path; with image.replace_original_on_compress
        the original is deleted after a successful compression instead. Files already
        in the deploy format are final. Progress is reported in compression_status/compression_progress.
