      description: 'Updates the authenticated user''s profile. This is a PARTIAL update:
        an omitted field is left unchanged, so sending only "name" does not touch
        the email. An explicitly empty or unparseable email is refused with 400 rather
        than stored — the email is the sign-in and password-reset identifier, and
        blanking it would lock the account out with no self-service way back. Changing
        the email to a different address clears its verified state and sends a fresh
