      ssh_key_id:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.ResolvedUUID'
      ssh_password_auth:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.ResolvedFlag'
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag:
