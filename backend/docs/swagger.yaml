      storage_type:
        description: '"gcp" or "local"'
        type: string
      uploaded_at:
        description: When the current file was uploaded
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.BootInfo:
    properties:
      boot_devices_order:
        description: 'Boot order array: ["nvme", "sd", "usb", "restart"]'
        items:
          type: string
        type: array
      boot_http_host:
        description: EEPROM-baked HTTP_HOST (the netboot server this device fetches
          from)
        type: string
      boot_http_path:
        description: EEPROM-baked HTTP_PATH read back from the running EEPROM; what
          phase-2 httpboot enforcement confirms a flash against
        type: string
      booted_at:
        description: Unix timestamp (seconds since epoch) when the system booted
        type: integer
      bootloader_timestamp:
        type: integer
      bootloader_version:
        description: |-
          BootloaderVersion/BootloaderTimestamp are the RUNNING EEPROM firmware as
          reported by the agent (works on NAT'd/steady-state nodes that never
          HTTP-boot, unlike the httpboot handler's UA-captured value).
        type: string
      current_boot_device:
        description: 'Current boot device: "sd", "usb", "nvme", "http", or empty if
          unknown'
        type: string
      recovery_bootstrap:
        description: |-
          RecoveryBootstrap reports that the node is running the RAM-backed recovery
          image rather than an installed OS. CurrentBootDevice cannot substitute for
          it: the same bootstrap reports "http" when netbooted and "sd" when booted
          from a provisioning card. Agents older than 0.4.5 never set it, so the
          boot-device test stays as the fallback.
        type: boolean
      root_device:
        description: |-
          RootDevice is the whole disk the node is running from ("/dev/nvme0n1"),
          empty when there is none to name — the recovery bootstrap's normal case,
          since its root is RAM — and empty on agents older than 0.5.5.

          CurrentBootDevice cannot substitute: it is a CLASS from the ROM boot-mode
          byte and cannot separate two devices of the same kind, which is the
          ambiguity that makes an operator wipe the wrong medium.
        type: string
      root_persistence:
        description: |-
          RootPersistence is how the root filesystem keeps writes: "persistent",
          "overlay" (overlayroot — writes land in a tmpfs upper layer and
          evaporate at reboot), or "" from an agent that predates the field or a
          RAM-backed recovery root (which RecoveryBootstrap already covers).
          Write-shaped dispatch is REFUSED on "overlay": an apply that evaporates
          while its recorded hash suppresses the re-apply is worse than a refusal,
          and the worst member of the family is a key revocation that reads as
          done. "" changes nothing — an old agent keeps today's behaviour.
        type: string
      uptime_seconds:
        description: Seconds since boot (clock-independent; reliable on RTC-less/netbooted
          devices)
        type: integer
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.CPUInfo:
    properties:
      board_revision:
        description: |-
          BoardRevision is the raw Raspberry Pi board revision code (e.g. "c04170"),
          empty on non-Pi hardware and on agents older than 0.4.5. Prefer it over
          Model for anything board-specific: Model comes from the device tree, and
          the recovery bootstrap forces one device_tree= for all BCM2712, so every
          Pi 5 in recovery calls itself a Compute Module 5.
        type: string
      cores:
        description: Number of CPU cores
        type: integer
      info:
        description: Additional CPU information (architecture, features, etc.)
        type: string
      model:
        description: CPU model name
        type: string
      vendor:
        description: CPU vendor (e.g., "Intel", "AMD", "ARM")
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.DigitalLEDSpec:
    properties:
      brightness:
        type: integer
      high:
        type: number
      low:
        type: number
      source:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.EEPROMInfo:
    properties:
      description:
        description: Additional info (e.g., "CM4 EEPROM updates enabled")
        type: string
      enabled:
        description: Whether EEPROM updates are enabled
        type: boolean
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.HATInfo:
    properties:
      product:
        type: string
      product_id:
        type: string
      product_ver:
        type: string
      uuid:
        type: string
      vendor:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.HardwareFingerprint:
    properties:
      hardware_serial:
        description: Hardware serial number for additional entropy
        type: string
      mac_address:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.HardwareInfo:
    properties:
      boot:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.BootInfo'
        description: Boot information (current device + order)
      cpu:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.CPUInfo'
        description: CPU information
      eeprom:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.EEPROMInfo'
        description: EEPROM information (Raspberry Pi only)
      hat:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.HATInfo'
        description: |-
          HAT is the spec-compliant HAT ID EEPROM, nil when no HAT is present
          (agents >= 0.6.0; older agents simply never send it).
      power:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.PowerInfo'
        description: |-
          Power is the SoC's power/thermal throttling state. Nil means the device
          could not answer (not a Pi, no vcgencmd, or an agent older than 0.5.4) —
          which is deliberately different from a zeroed reading, because "the supply
          is fine" and "we have no idea" must not look the same.
      ram:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.RAMInfo'
        description: RAM information
      tpm:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.TPMInfo'
        description: TPM (Trusted Platform Module) information
      usb:
        description: |-
          USB lists attached non-storage USB devices. Empty is normal: hardware with
          no USB bus, and every agent older than 0.5.5. Storage is deliberately
          absent — a USB disk is already a StorageDevice.
        items:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.USBDevice'
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDCapabilities:
    properties:
      digital_leds:
        description: 'DigitalLEDs: how many digital LEDs the board carries (0 = none).'
        type: integer
      stealth_available:
        description: 'StealthAvailable: the board declares a stealth transistor GPIO.'
        type: boolean
      supported_sources:
        description: |-
          SupportedSources: the ambient sources the node's AGENT can render (its
          advertisement, or the v1 pair for agents predating LED v2). The UI
          offers exactly these.
        items:
          type: string
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDCommandRef:
    properties:
      details:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDConfig:
    properties:
      act_led_off:
        type: boolean
      digital_leds:
        description: |-
          DigitalLEDs is the LED v2 parameterized form: per-LED source plus
          gradient bounds and brightness. When present it is the source of truth
          and DigitalSources is derived from it.
        items:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.DigitalLEDSpec'
        type: array
      digital_sources:
        description: |-
          DigitalSources assigns an indication source per digital LED (index =
          chain position). Absent entries render dark. With DigitalLEDs present
          this is the DERIVED v1 projection (sources only), kept in the wire
          payload so an older agent renders the same sources with its built-in
          defaults.
        items:
          type: string
        type: array
      pwr_led_off:
        type: boolean
      stealth_mode:
        type: boolean
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDState:
    properties:
      applied_hash:
        type: string
      capabilities:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDCapabilities'
      capabilities_unknown:
        description: |-
          CapabilitiesUnknown marks a read where the device-profile resolver
          FAILED: Capabilities is then empty because nothing could be read, not
          because the board declares nothing — the UI must say "could not
          resolve", never "this board has no LED features".
        type: boolean
      desired:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDConfig'
      desired_hash:
        type: string
      desired_source:
        description: |-
          DesiredSource: which level supplied Desired (node|ou|root_ou|account).
          Absent when nothing is declared anywhere.
        type: string
      in_sync:
        type: boolean
      last_command:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDCommandRef'
      queued:
        type: boolean
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.NetworkInfo:
    properties:
      hostname:
        description: System hostname
        type: string
      ip:
        description: Primary IP address
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.OSInfo:
    properties:
      details:
        description: OS distribution details (e.g., "Ubuntu 22.04 LTS")
        type: string
      version:
        description: OS version
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.PowerInfo:
    properties:
      freq_capped_now:
        type: boolean
      freq_capped_since_boot:
        type: boolean
      soft_temp_limit_now:
        type: boolean
      soft_temp_limit_since_boot:
        type: boolean
      throttled_flags:
        description: |-
          ThrottledFlags is the raw mask, kept so a bit this build does not decode is
          still visible to an operator and to support.
        type: integer
      throttled_now:
        type: boolean
      throttled_since_boot:
        type: boolean
      under_voltage_now:
        description: Right now.
        type: boolean
      under_voltage_since_boot:
        description: |-
          Since boot — sticky until reboot, and the more valuable half: it explains a
          failure after the fact, which is when somebody is actually looking.
        type: boolean
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.RAMInfo:
    properties:
      size:
        description: Total RAM size in bytes
        type: integer
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.StorageDevice:
    properties:
      device_type:
        description: 'Device type: "ssd", "hdd", "nvme", "usb", etc.'
        type: string
      is_read_only:
        description: Whether the device is read-only
        type: boolean
      is_removable:
        description: Whether the device is removable
        type: boolean
      label:
        description: Human-readable label/name
        type: string
      model:
        description: Device model name
        type: string
      partitions:
        description: Array of partitions on this device
        items:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.StoragePartition'
        type: array
      path:
        description: Device path (e.g., "/dev/sda")
        type: string
      serial:
        description: Serial number
        type: string
      total_capacity:
        description: Total capacity in bytes
        type: integer
      vendor:
        description: Device vendor/manufacturer
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.StoragePartition:
    properties:
      available_space:
        description: Available space in bytes
        type: integer
      filesystem:
        description: Filesystem type (e.g., "ext4", "xfs", "ntfs", "")
        type: string
      mount_point:
        description: Mount point (if mounted), empty if not mounted
        type: string
      partition_id:
        description: Partition identifier (e.g., "/dev/sda1", "nvme0n1p1")
        type: string
      used_space:
        description: Used space in bytes
        type: integer
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.SystemInfo:
    properties:
      hardware:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.HardwareInfo'
        description: Hardware information
      network:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.NetworkInfo'
        description: Network information
      os:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.OSInfo'
        description: OS information
      storage_devices:
        additionalProperties:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.StorageDevice'
        description: Storage devices map
        type: object
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.TPMInfo:
    properties:
      description:
        description: TPM description/additional info if available
        type: string
      model:
        description: TPM module model (e.g., "SLB9670") if available
        type: string
      present:
        description: Whether TPM is present
        type: boolean
      version:
        description: TPM version (e.g., "2.0", "1.2") if available
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.USBDevice:
    properties:
      class_code:
        description: |-
          ClassCode is the USB-IF class of the device or its first interface. Raw on
          the wire and named here, the same division as CPUInfo.BoardRevision: the
          table belongs to USB-IF, so a new class becomes readable with a backend
          deploy rather than a fleet-wide agent roll.
        type: integer
      manufacturer:
        type: string
      port:
        description: bus path; what tells two identical dongles apart
        type: string
      product:
        type: string
      product_id:
        type: string
      speed:
        description: Mbit/s as the kernel reports it
        type: string
      vendor_id:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogCommandRef:
    properties:
      details:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogConfig:
    properties:
      agent_change_sec:
        type: integer
      agent_health:
        description: 'Agent health: reboot when the agent stops refreshing its liveness
          file.'
        type: boolean
      enabled:
        type: boolean
      interface:
        type: string
      interval_sec:
        type: integer
      max_load_1:
        description: Thresholds. 0 means "do not supervise this".
        type: integer
      max_load_5:
        type: integer
      max_load_15:
        type: integer
      max_temperature_c:
        type: integer
      min_memory_pages:
        type: integer
      network:
        description: 'Network: reboot when the node cannot reach any of these.'
        type: boolean
      os_hang:
        description: 'OS hang: the daemon pets /dev/watchdog; the kernel reboots if
          it stops.'
        type: boolean
      ping_count:
        type: integer
      ping_targets:
        items:
          type: string
        type: array
      retry_timeout_sec:
        type: integer
      watchdog_timeout_sec:
        type: integer
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogState:
    properties:
      applied_hash:
        type: string
      desired:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogConfig'
      desired_hash:
        type: string
      desired_source:
        description: |-
          DesiredSource names the level the desired config came from
          ("node"|"ou"|"root_ou"|"account") — the LED pattern. An inherited config
          is shown with its source; applying it stays an explicit per-node action.
        type: string
      disarm_reason:
        type: string
      in_sync:
        type: boolean
      last_command:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogCommandRef'
        description: |-
          LastCommand is the newest apply_watchdog_config command, so the UI can
          show in-flight/failed converges without polling the command list itself.
      last_refusal:
        description: |-
          LastRefusal is the agent's pre-arm verification declining a config
          ("<code>: <details>"). Cleared on the next confirmed apply.
        type: string
      public_ping_targets:
        items:
          type: string
        type: array
      queued:
        description: |-
          Queued means the converge command is accepted but NOT applied — the node
          is offline (or netbooted) and will receive it on reconnect. A dispatched
          command is not an armed watchdog.
        type: boolean
      recovery_limited:
        type: boolean
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogStatusScanResult:
    properties:
      applied_hash:
        type: string
      breaker_boot_id:
        type: string
      breaker_boots:
        type: integer
      breaker_disarmed:
        type: boolean
      breaker_known:
        description: |-
          Breaker state, as the agent persisted it. AppliedHash here is what the
          DEVICE believes it applied, so a mismatch against the desired hash is a
          drift the command history cannot show.
        type: boolean
      breaker_reason:
        type: string
      conf_present:
        type: boolean
      detail:
        type: string
      device_present:
        description: |-
          DevicePresent is /dev/watchdog. Absent means the hardware watchdog has not
          attached yet (it needs the config.txt dtparam plus a reboot), which the OS
          hang preset depends on.
        type: boolean
      disarmed_by_platform:
        description: |-
          DisarmedByPlatform is the benign counterpart: supervision is off because
          the platform asked, not because anything went wrong.
        type: boolean
      drop_in_present:
        type: boolean
      liveness_age_sec:
        description: |-
          LivenessAgeSec is how long ago the agent last refreshed the file the
          agent-health preset supervises. Nil when the file is absent — which on an
          armed agent-health node is itself the finding.
        type: integer
      service_enabled:
        type: string
      service_state:
        description: |-
          ServiceState / ServiceEnabled are systemd's own words ("active",
          "inactive", "enabled", "disabled", ...). Empty means the probe could not
          tell — never assume "inactive" from an empty answer.
        type: string
      status:
        description: '"running" | "completed" | "failed"'
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node_file.ReadResult:
