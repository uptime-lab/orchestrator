  /api/v1/nodes/{id}/command:
    post:
      consumes:
      - application/json
      description: Sends a command (reboot, shutdown, status_check) to a node
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: string
      - description: Command data (slug + per-command params)
        in: body
        name: command
        required: true
        schema:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_command.NodeCommandCommand'
      produces:
      - application/json
      responses:
        "200":
          description: Command accepted. data.command_id names it; data.delivery is
            dispatched (handed to the connected node) or queued (a queueable command
            registered for an offline node, delivered on reconnect). Either way the
            outcome arrives later on the command itself.
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 'Validation error: a parameter of the wrong shape, a required
            parameter missing or blank, a value the command refuses (a relative or
            refused file path, an unknown manage_service action, a download checksum
            that is not SHA-256, a credential given to provision_connection, which
            resolves it from the provisioning policy), an install_os image that cannot
            be installed (not found, still being processed, no file), or an agent
            too old for the command'
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "404":
          description: Node not found
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: 'The node''s state refuses the command: offline or not approved
            (node_unavailable, node_not_approved), already on the requested agent
            version (agent_already_current; set reinstall to true to reinstall), a
            watcher (Watcher) node, a disk already owned by another command, a Watcher
            install the device could not return from, a recovery-only command (capture_image,
            patch_file_offline, apply_access_config_offline) for a node running its
            installed OS (recovery_required), an erase of the disk the node runs from
            (boot_drive), a capture the account''s image cap or quota has no room
            for (image_limit), or a provision_connection whose node resolves no OS
            username or no password or SSH key for it (provisioning_incomplete)'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "503":
          description: Node not connected
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Send command to node
      tags:
      - nodes
  /api/v1/nodes/{id}/device-profile:
    get:
      description: The effective equipage (resolved node -> OU -> root -> account,
        with the source level), per-option declared/applied/confirmed statuses, granted
        capabilities, the applied and desired render hashes, compatible profile ids
        for the picker, and the HAT identity the last scan reported.
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Device profile state
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
