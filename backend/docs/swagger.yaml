  /api/v1/server/capabilities:
    get:
      description: Reports which optional feature groups this deployment supports
        (SSH adoption, EEPROM signing, netboot, SD provisioning, terminal) and whether
        an account-deletion request is carried out by the install's operator console
        (account_erasure, hosted install only). The UI hides what the install cannot
        do. serial_lease_days is how long a device bound to a never-admitted node
        may stay silent before its serial is released (0 = never); revision is the
        commit the backend was built from, omitted when the build recorded none; version
        is the platform release it was built for, empty for a build from source.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_server_info.Capabilities'
              type: object
      security:
      - BearerAuth: []
      summary: Get server capabilities
      tags:
      - server
  /api/v1/server/entitlement:
    get:
      description: 'Returns what this install runs under. Instance-wide. Requires
        entitlement.manage (super_admin). For the account that operates the install
        (the oldest account; instance_operator=true): the free device cap, the file
        in force (customer, kind, cap, issue and expiry, grace, note, source), the
        effective cap admission enforces right now (never below the free cap: a signed
        positive cap under it is enforced as the free cap and flagged device_cap_below_free_floor),
        the install-wide admitted device count (admitted_devices, every account counted),
        the caller''s own account''s admitted count (account_devices), and any offered
        file that did not verify. For any other account: the summary only — state,
        the caps, the caller''s own account''s admitted count (account_devices), expiry
        and grace — never the customer, kind, note, source, rejections or the install-wide
        count (admitted_devices is absent). A count that could not be read is -1.
        Both counts are ADMITTED devices, what the cap counts: an approved node past
        its first connect. A node pending approval, a placeholder or node awaiting
        its first connect, and a rejected node are not counted, so account_devices
        can be lower than the number of rows on the Nodes page. mode is instance for
        the shapes above. When the install sets a per-account device limit (ACCOUNT_DEVICE_LIMIT)
        and the caller''s account is not the instance operator, mode is account_limit
        and the answer is the account''s own: account_device_limit (its limit now;
        0 = no limit, -1 = could not be read), account_plan (free = the install default,
        subscription = an operator''s override in force), account_plan_until (when
        a dated subscription ends; absent otherwise), account_devices and account_limit_contact
        (where to write for more devices) — and none of the install''s entitlement
        (no state, caps, expiry, grace or subscription_url).'
      produces:
      - application/json
      responses:
        "200":
          description: The entitlement in force
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.EntitlementResult'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get the device entitlement
      tags:
      - server
    put:
      consumes:
      - application/json
      description: 'Verifies a pasted entitlement file against the keys built into
        this server and stores it. The newest valid file wins, so pasting the next
        file extends or upgrades the entitlement and revokes nothing. The answer carries
        the terms of the file in force and, in applied, the pasted file''s own terms
        and standing: in_force is false when a valid file was stored but another one
        is in force (it was issued before a file still active or in grace, or it has
        already lapsed), and state is the pasted file''s own phase (active, grace
        or lapsed). applied appears on this answer only, never on the GET. A file
        that does not verify is refused with 400 (code entitlement_rejected) and nothing
        is stored. Requires entitlement.manage (super_admin), a recent step-up confirmation,
        and that the caller''s account operates the install (the oldest account):
        any other account is refused with 403 (code not_instance_operator).'
      parameters:
      - description: Step-up confirmation ticket, from POST /api/v1/users/me/reauth/password,
          /reauth/totp or /reauth/passkey/finish
        in: header
        name: X-Reauth-Ticket
        type: string
      - description: The paste form of the entitlement file
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_entitlement_apply.EntitlementApplyCommand'
      produces:
      - application/json
      responses:
        "200":
          description: The entitlement now in force, and the pasted file in applied
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.EntitlementResult'
              type: object
        "400":
          description: Validation error, or entitlement_rejected (the file does not
            verify or its terms are invalid)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "403":
          description: Forbidden, reauth_required (confirm your identity and retry),
            or not_instance_operator (the caller's account does not operate this install)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Apply an entitlement file
      tags:
      - server
