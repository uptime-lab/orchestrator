      tags:
      - nodes
  /api/v1/nodes/deleted/{id}/restore:
    post:
      consumes:
      - application/json
      description: 'Re-creates the node row under its ORIGINAL id, token and boot
        override, so a device still carrying that identity is accepted again. Restores
        an identity only: command history, tracked files, secret attachments and workflow
        runs are gone for good. The device re-reports its hardware on the next connect.
        Refused with 409 when the node''s hardware serial has since been registered
        to another account: a deleted node''s serial is free for anyone to bind, and
        restoring one that has moved would return a record no device can reach. Refused
        with 409 (code serial_bound_in_account, the live node''s node_id and node_name
        in data) when the serial is carried by another live node of this account —
        the board was adopted again as a new node; delete that node first to take
        this one back. A node that was admitted when it was deleted is admitted again
        by its restore, under the device cap: when the install is at its cap the restore
        is refused with 409 (code device_cap_reached, the numbers in data) and the
        record stays restorable; likewise when the account is at its own device limit
        (code account_device_limit_reached; data: limit, account_devices, plan, until
        for a dated subscription, contact).'
      parameters:
      - description: Deleted node ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Node restored successfully
          schema:
