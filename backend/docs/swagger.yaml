        token). A pending node takes no commands; on approval of a node running its
        installed OS the platform sends it the access configuration and utilities
        that reach it, when any are due. A node running the recovery system from a
        provisioning card also has its bootloader rewritten to boot from this server
        first, when its effective network-first policy is on (the default); a node
        running its own operating system, from any medium, keeps its bootloader. The
        node''s boot target is not changed: set it (PUT /api/v1/nodes/{id}/policy)
        before approving if the inherited one is not what the device should boot.'
