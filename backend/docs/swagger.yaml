    post:
      consumes:
      - application/json
      description: Signs a fresh per-device EEPROM image (latest firmware base, serial
        baked into HTTP_PATH, adoption token, requested boot order) and commands the
        online node to flash it. Where the node's system has rpi-eeprom-update (a
        managed OS) the flash is direct (flashrom), does not reboot the node, and
        needs a reboot to take effect; on the recovery system (netbooted or from an
        SD card), or an OS without that tool, the package is staged on the SD/USB
        boot partition and the node reboots at once to apply it. A netbooted node
        without SD/USB media cannot flash and the command fails.
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional boot order override (default http,nvme,sd,restart)
        in: body
        name: request
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_node.ProvisionEEPROMRequest'
      produces:
      - application/json
      responses:
        "200":
          description: EEPROM flash triggered
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "404":
          description: Node not found
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: The node runs the watcher (Watcher) agent and executes no commands,
            or has not reported its hardware serial yet (code no_hardware_serial)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Provision per-device EEPROM (netboot identity / boot order / bootloader
        update)
      tags:
      - nodes
