              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: Hardware serial registered to another organization; the install
            is at its device cap (device_cap_reached) or the account at its own device
            limit (account_device_limit_reached); or the device connected while the
            re-flash was being prepared (device_connected_during_flash)
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
