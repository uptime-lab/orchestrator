  /api/v1/eeprom/webusb-provision:
    post:
      consumes:
      - application/json
      description: 'Given a SoC + a serial harvested over WebUSB, creates or matches
        a node, bakes a network-first signed EEPROM carrying that node''s adoption
        token, and returns where to fetch the package. The browser then flashes it;
        the device boots network-first and adopts as the node. Provisioning credentials
        are optional at flash time, and the server sets no default username or password:
        an omitted default_username leaves the node with no provisioning account (name
        one before running provision_connection), and an omitted default_password
        means no console password.'
      parameters:
      - description: SoC, serial and node defaults
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pkg_webapp_infrastructure_http_server_handlers_node.WebUSBProvisionRequest'
      produces:
      - application/json
      responses:
