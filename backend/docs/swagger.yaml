  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.EntitlementResult:
    properties:
      account_device_limit:
        description: |-
          The per-account limit, account_limit mode only.
          AccountDeviceLimit is the account's limit now: 0 = no limit, -1 = it
          could not be read.
        type: integer
      account_devices:
        description: |-
          AccountDevices is the caller's own account's admitted count; -1 when
          it could not be read. Both shapes. Admitted, like the cap: a node
          pending approval, awaiting its first connect or rejected is not in it.
        type: integer
      account_limit_contact:
        description: |-
          AccountLimitContact is where to write for more devices; absent when the
          install configures none.
        type: string
      account_plan:
        description: |-
          AccountPlan: free (the install's default limit) | subscription (an
          operator's override in force). Absent when the limit could not be read.
        type: string
      account_plan_until:
        description: |-
          AccountPlanUntil is when a dated subscription ends; absent for the free
          plan and for a subscription with no end.
        type: string
      admitted_devices:
        description: |-
          AdmittedDevices is the install's admitted count, every account
          counted; -1 when it could not be read. Operator only: absent from the
          summary.
        type: integer
      applied:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.EntitlementAppliedResult'
        description: |-
          Applied describes the file the request pasted: present on the PUT
          answer only, operator only. The terms above are the file IN FORCE,
          which is another file when the pasted one was issued before a file
          still active or in grace, or has already lapsed.
      applied_at:
        type: string
      customer_id:
        description: The file in force, absent when none.
        type: string
      device_cap:
        type: integer
      device_cap_below_free_floor:
        description: |-
          DeviceCapBelowFreeFloor: the file in force signs a positive cap below
          the free cap, so the free cap (the floor) is what EffectiveDeviceCap
          carries. Operator only, like the signed DeviceCap it explains.
        type: boolean
      effective_device_cap:
        description: |-
          EffectiveDeviceCap is what admission enforces now; 0 = unlimited.
          Instance mode only.
        type: integer
      expires_at:
        type: string
      free_device_cap:
        description: FreeDeviceCap is what applies with no entitlement. Instance mode
          only.
        type: integer
      grace_days:
        type: integer
      grace_until:
        type: string
      instance_operator:
        description: |-
          InstanceOperator: the caller's account operates this install, so this
          is the full card and the caller may apply a file.
        type: boolean
      issued_at:
        type: string
      kind:
        type: string
      mode:
        description: |-
          Mode: instance (the install's entitlement, both shapes above) |
          account_limit (the caller's own per-account limit).
        type: string
      note:
        type: string
      rejections:
        description: Rejections names every offered file that did not verify, by source.
        items:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.EntitlementRejectionResult'
        type: array
      source:
        description: 'Source: none | file | database. Operator only.'
        type: string
      state:
        description: 'State: free | active | grace | lapsed | rejected. Instance mode
          only.'
        type: string
      subscription_url:
        description: SubscriptionURL is where to go for a file. Instance mode only.
        type: string
    type: object
