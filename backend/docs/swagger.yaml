definitions:
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_account_policy_update.AccountPolicyUpdateCommand
  : properties:
      boot_to_os:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      default_password:
        type: string
      default_username:
        type: string
      device_profile:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_device_profile.Equipage'
        description: |-
          DeviceProfile: nil = unchanged; a zero equipage (empty profile_id) =
          clear back to unset; a populated one = set as the account-wide fallback.
          Validated against the registry catalog in the service before storing.
      led_config:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDConfig'
        description: 'LEDConfig: nil = unchanged; a zero config = clear back to none.'
      network_first:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      os_image_id:
        type: string
      ssh_key_id:
        type: string
      ssh_password_auth:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      watchdog_config:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogConfig'
        description: |-
          WatchdogConfig: nil = unchanged; a DISABLED config = clear back to none
          (an account declaration is always an armed supervision — disarm is the
          per-node action). The save dispatches nothing.
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_account_update.AccountUpdateCommand:
    properties:
      id:
        type: string
      identify_duration_sec:
        description: IdentifyDurationSec sets how long identify blinks run (10..3600
          s).
        type: integer
      name:
        description: |-
          Name is a POINTER (the NodeUpdateCommand doctrine): omitted means
          "unchanged". It used to be required, which made every settings toggle
          (2FA policy, identify duration) carry the name captured at page mount —
          and silently revert a rename another operator saved in between.
        type: string
      require_two_factor:
        description: |-
          RequireTwoFactor makes a second factor mandatory for every member who
          signs in with a password; a member with no password (Google only) is
          never challenged on that path and so is not asked to enrol.
          A POINTER so an update that only renames the account does not silently
          switch the policy off: absent means "leave as is".
        type: boolean
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_entitlement_apply.EntitlementApplyCommand:
    properties:
      document:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_image_create.ImageCreateCommand:
    properties:
      description:
        type: string
      image_url:
        type: string
      title:
        type: string
      version:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_image_update.ImageUpdateCommand:
    properties:
      description:
        type: string
      image_url:
        type: string
      title:
        type: string
      version:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_master_token_create.MasterTokenCreateCommand:
    properties:
      default_password:
        type: string
      default_username:
        type: string
      expires_at:
        type: string
      name:
        type: string
      ou_id:
        description: 'OUID: devices adopted with this token are placed into this OU.'
        type: string
      ssh_key_id:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_master_token_update.MasterTokenUpdateCommand:
    properties:
      default_password:
        type: string
      default_username:
        type: string
      expires_at:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      ou_id:
        description: 'OUID: nil = unchanged, "" = clear, UUID string = set (adoption
          target OU).'
        type: string
      ssh_key_id:
        description: |-
          SSHKeyID: nil = unchanged, "" = clear (adopted devices get no key from
          this token), UUID string = set. A null in JSON cannot mean "clear": it
          decodes to the same nil as an absent field.
        type: string
      tags:
        description: nil = unchanged, [] = clear
        items:
          type: string
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_command.BatchCommandResult:
    properties:
      failure_count:
        type: integer
      queued_count:
        description: |-
          QueuedCount and SkippedCount break the total down so callers can render
          "accepted / queued / skipped" instead of implying everything landed.
        type: integer
      results:
        items:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_command.NodeCommandResultItem'
        type: array
      skipped_by_reason:
        additionalProperties:
          type: integer
        type: object
      skipped_count:
        type: integer
      success_count:
        description: |-
          SuccessCount counts commands ACCEPTED by the platform, which includes
          queued ones. It does not mean the command ran on the node.
        type: integer
      total_count:
        type: integer
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_command.BatchNodeCommandCommand:
    properties:
      command:
        description: '"reboot", "shutdown", "status_check", etc.'
        type: string
      node_ids:
        description: List of node IDs to send command to
        items:
          type: string
        type: array
      params:
        additionalProperties: true
        description: 'Optional key:value params (e.g., {"delay_seconds": 0})'
        type: object
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_command.NodeCommandCommand:
    properties:
      command:
        description: '"reboot", "shutdown", "status_check"'
        type: string
      params:
        additionalProperties: true
        description: 'Optional key:value params (e.g., {"delay_seconds": 0})'
        type: object
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_command.NodeCommandResultItem:
    properties:
      command_id:
        description: Only present if successful
        type: string
      error:
        description: Only present if failed
        type: string
      node_id:
        type: string
      queued:
        description: |-
          Queued marks a command accepted for a node that is currently offline: it
          waits and is delivered on reconnect. Success is true, but nothing has been
          applied yet — callers must not report it as done.
        type: boolean
      skip_reason:
        type: string
      skipped:
        description: |-
          Skipped marks a node deliberately not attempted, with SkipReason naming
          which precondition it failed.
        type: boolean
      success:
        type: boolean
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_create.NodeCreateCommand:
    properties:
      default_password:
        description: 'Optional: console login password; needs default_username'
        type: string
      default_username:
        description: 'Optional: console account provisioning creates; required when
          default_password is set'
        type: string
      name:
        type: string
      provision_network_first:
        description: |-
          ProvisionNetworkFirst opts the node into one-shot network-first EEPROM
          provisioning: a per-node NetworkFirst override is set and the platform
          flashes the EEPROM the first time the agent reports system info.
        type: boolean
      ssh_key_id:
        description: 'Optional: if not provided, default SSH key will be used'
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_file_update.NodeFileUpdateCommand:
    properties:
      content:
        type: string
      path:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_ssh_adopt.SSHAdoptCommand:
    properties:
      auth_ssh_key_id:
        description: a connection keypair to auth with
        type: string
      default_password:
        type: string
      default_username:
        type: string
      host:
        description: Connection.
        type: string
      host_key_fingerprint:
        description: |-
          HostKeyFingerprint pins the device's SSH host key directly (SHA256:…),
          for an API client that knows the key out of band. A different key fails
          the handshake before any credential is offered.
        type: string
      host_key_ticket:
        description: |-
          HostKeyTicket is the proof a reachable preflight returned: THIS user, in
          THIS account, saw THIS host key on THIS host:port within the last few
          minutes. The adoption connects strictly against the key inside it. It
          is the path the UI takes.
        type: string
      node_name:
        description: Node record to create for this device.
        type: string
      node_ssh_key_id:
        description: key provisioned onto the node
        type: string
      password:
        type: string
      port:
        type: integer
      provision_network_first:
        type: boolean
      sudo_password:
        type: string
      use_agent:
        description: auth via the forwarded ssh-agent (YubiKey)
        type: boolean
      username:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_ssh_preflight.SSHPreflightCommand:
    properties:
      accept_new_host_key:
        description: |-
          AcceptNewHostKey, together with ExpectedHostKeyFingerprint, lets THIS
          probe accept a key that differs from the expected one: the operator has
          seen the host_key_changed report and says the device was reinstalled.
          The reset is recorded in the audit trail with both fingerprints. Without
          the flag a different key stays a refusal; without an expectation there
          is nothing to reset, so the flag alone is a validation error.
        type: boolean
      expected_host_key_fingerprint:
        description: |-
          ExpectedHostKeyFingerprint is the fingerprint an earlier preflight saw
          (SHA256:…). When present the probe connects strictly and a different key
          is reported as host_key_changed with both fingerprints, before any
          credential is offered. A server whose host_key_policy is "strict"
          refuses a probe without one.
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      ssh_key_id:
        description: a connection keypair to auth with
        type: string
      sudo_password:
        type: string
      use_agent:
        description: auth via the forwarded ssh-agent (YubiKey)
        type: boolean
      username:
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_node_update.NodeUpdateCommand:
    properties:
      default_password:
        description: 'Optional: Default password for provisioning'
        type: string
      default_username:
        description: 'Optional: Default username for provisioning'
        type: string
      name:
        description: Optional
        type: string
      notes:
        description: 'Optional: free-form operator notes'
        type: string
      ssh_key_id:
        description: 'Optional: SSH key ID for provisioning'
        type: string
    type: object
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_organizational_unit_create.OrganizationalUnitCreateCommand
  : properties:
      boot_to_os:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
        description: inherit|on|off
      default_password:
        type: string
      default_username:
        description: |-
          Provisioning defaults; empty string means inherit. SSHKeyID/OSImageID are
          UUID strings ("" = inherit).
        type: string
      device_profile:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_device_profile.Equipage'
      led_config:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDConfig'
      name:
        type: string
      network_first:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
        description: inherit|on|off
      os_image_id:
        type: string
      parent_id:
        type: string
      position:
        description: |-
          Position, DeviceProfile, LEDConfig and WatchdogConfig take the update
          command's meaning and validation: every policy a PUT stores, a create
          stores too, rather than answering 201 and dropping it. Nil = not set.
        type: integer
      ssh_key_id:
        type: string
      ssh_password_auth:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
        description: |-
          SSHPasswordAuth controls whether sshd accepts password logins. Named in the
          positive so "off" unambiguously means passwords are refused.
      watchdog_config:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogConfig'
    type: object
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_organizational_unit_update.OrganizationalUnitUpdateCommand
  : properties:
      boot_to_os:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      default_password:
        type: string
      default_username:
        description: |-
          Provisioning defaults: nil = unchanged, "" = clear to inherit, value = set.
          SSHKeyID/OSImageID are UUID strings.
        type: string
      device_profile:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_device_profile.Equipage'
        description: |-
          DeviceProfile: nil = unchanged; a zero equipage (empty profile_id) =
          clear back to inherit; a populated one = set for the unit's nodes.
          Inherited as ONE block, and validated against the registry catalog in
          the service before storing.
      led_config:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.LEDConfig'
        description: |-
          LEDConfig: nil = unchanged; a zero config (all defaults) = clear back to
          inherit. One block, like the device profile.
      name:
        type: string
      network_first:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      os_image_id:
        type: string
      parent_id:
        description: |-
          ParentID reparents the unit: nil = unchanged, "" = make it a root unit, a
          UUID string = nest under that (root) unit. The two-level limit is enforced.
        type: string
      position:
        description: Position sets the sibling sort order (nil = unchanged).
        type: integer
      ssh_key_id:
        type: string
      ssh_password_auth:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      watchdog_config:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.WatchdogConfig'
        description: |-
          WatchdogConfig: nil = unchanged; a DISABLED config = clear back to
          inherit. An OU declaration is always an armed supervision: with no
          auto-apply there is nothing for an inheritable "off" to shield, and
          disarm is the per-node action. One block, like the LED config, and the
          save dispatches nothing.
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_secret_create.SecretCreateCommand:
    properties:
      key:
        description: 'env: ENV var name; credential: username; opaque: optional label'
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_secret.SecretKind'
        description: env|credential|opaque
      name:
        type: string
      sensitive:
        description: |-
          Sensitive defaults to true when omitted. Only env entries may be
          non-sensitive ("variables", value readable through the API); credential
          and opaque entries are always sensitive.
        type: boolean
      tags:
        description: Tags are free-form purpose labels (lowercased, deduped, max 10).
        items:
          type: string
        type: array
      value:
        description: the secret value (stored encrypted)
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_secret_update.SecretUpdateCommand:
    properties:
      key:
        type: string
      name:
        type: string
      sensitive:
        description: |-
          Sensitive: nil = unchanged. The true->false transition is rejected
          (a write-only value must never become readable); false->true is allowed.
        type: boolean
      tags:
        description: 'Tags: nil = unchanged, [] = clear, list = replace.'
        items:
          type: string
        type: array
      value:
        description: nil = unchanged, "" = set empty
        type: string
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_ssh_key_create.SSHKeyCreateCommand:
    properties:
      alias:
        type: string
      key_content:
        type: string
      key_type:
        description: '"ssh" or "ca", defaults to "ssh"'
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_ssh_key_generate.SSHKeyGenerateCommand:
    properties:
      alias:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_ssh_key_update.SSHKeyUpdateCommand:
    properties:
      alias:
        description: Optional
        type: string
      is_default:
        description: Optional
        type: boolean
      key_content:
        description: Optional
        type: string
      tags:
        description: nil = unchanged, [] = clear
        items:
          type: string
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_login.UserLoginCommand:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_login_refresh.UserLoginRefreshCommand:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_password_update.UserUpdatePasswordCommand
  : properties:
      id:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_register.RegisterCommand:
    properties:
      email:
        type: string
      invite_code:
        type: string
      name:
        maxLength: 256
        type: string
      password:
        minLength: 8
        type: string
      terms_accepted:
        description: |-
          TermsAccepted is the sign-up form's statement that the person agreed to
          the operator's terms of use. Optional: an install without terms sends
          nothing. When true, the acceptance is stored on the user and recorded in
          the audit trail.
        type: boolean
    required:
    - email
    - password
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_user_update.UserUpdateCommand:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_workflow_execution_start.WorkflowExecutionStartCommand
  : properties:
      node_ids:
        description: List of node IDs to execute workflow on
        items:
          type: string
        type: array
      template_id:
        type: string
    type: object
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_workflow_template_create.WorkflowTemplateCreateCommand
  : properties:
      description:
        type: string
      graph:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_workflow_template.WorkflowGraph'
        description: |-
          Graph is the node-graph definition; when provided it is the source of
          truth and Steps are derived from it server-side.
      is_shortcut:
        type: boolean
      name:
        type: string
      ou_id:
        description: |-
          OUID is the LEGACY single-unit field, kept so an existing client keeps
          working; OUIDs supersedes it. Read them through ScopeOUIDs, never
          directly — a caller that sent only one and a caller that sent a set must
          end up in the same place.
        type: string
      ou_ids:
        description: |-
          OUIDs scopes the playbook to a SET of organizational units; empty = all
          nodes of the account.
        items:
          type: string
        type: array
      status:
        description: Status is active or draft; empty keeps the default/current value
        type: string
      steps:
        items:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_workflow_template.WorkflowStep'
        type: array
    type: object
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_workflow_template_import.WorkflowTemplateImportCommand
  : properties:
      document:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_workflow_template.PortableDocument'
        description: Document is the portable playbook document to import
      ou_id:
        description: |-
          OUID is the LEGACY single-unit field, kept so an existing client keeps
          working; OUIDs supersedes it. Read them through ScopeOUIDs, never
          directly — a caller that sent only one and a caller that sent a set must
          end up in the same place.
        type: string
      ou_ids:
        description: |-
          OUIDs scopes the playbook to a SET of organizational units; empty = all
          nodes of the account.
        items:
          type: string
        type: array
    type: object
  ? github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_in_commands_workflow_template_update.WorkflowTemplateUpdateCommand
  : properties:
      description:
        type: string
      expected_updated_at:
        description: |-
          ExpectedUpdatedAt, when set, makes this a compare-and-swap: the update is
          refused with ErrWorkflowTemplateStale if the stored row has moved on since
          the client read it.

          This is a full-document PUT — every field the client holds is written back
          — so without it one operator's save silently reverts another's. It is
          OPTIONAL rather than required because a required precondition would break
          every existing client at once; the editor sends it, and the API contract
          says a caller that omits it accepts last-write-wins.
        type: string
      graph:
        allOf:
        - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_workflow_template.WorkflowGraph'
        description: |-
          Graph is the node-graph definition; when provided it is the source of
          truth and Steps are derived from it server-side. An OMITTED graph means
          UNCHANGED: the stored one survives and Steps are re-derived from it. It
          deliberately does not clear the graph — a re-synthesized one is a bare
          chain that has lost every condition, join, wait, policy and schedule
          trigger, which silently and permanently unschedules the playbook.
      id:
        type: string
      is_shortcut:
        type: boolean
      name:
        type: string
      ou_id:
        description: |-
          OUID is the LEGACY single-unit field, kept so an existing client keeps
          working; OUIDs supersedes it. Read them through ScopeOUIDs, never
          directly — a caller that sent only one and a caller that sent a set must
          end up in the same place.
        type: string
      ou_ids:
        description: |-
          OUIDs scopes the playbook to a SET of organizational units; empty = all
          nodes of the account.
        items:
          type: string
        type: array
      status:
        description: Status is active or draft; empty keeps the default/current value
        type: string
      steps:
        items:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_workflow_template.WorkflowStep'
        type: array
    type: object
  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse:
    properties:
      code:
        description: |-
          Code is a stable machine-readable discriminator for the cases a client
          must ACT on differently rather than merely display — where the HTTP status
          alone is ambiguous. Empty on everything that only needs to be shown.
        type: string
