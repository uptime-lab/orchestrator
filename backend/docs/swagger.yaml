        machine: the universal backend blinks the sysfs ACT LED, boards whose profile
        declares digital LEDs get their configured rendering. The agent reports success
        immediately after starting the blink and stops on its own timer (the account''s
        identify duration setting, default 300 s, max 3600 s — the response carries
