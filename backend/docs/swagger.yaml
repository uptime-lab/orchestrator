  github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.NodeResult:
    properties:
      account_id:
        type: string
      agent_kind:
        description: '""/"full" = managing agent; "watcher" = telemetry-only (no commands)'
        type: string
      agent_version:
        description: Agent software version last reported on connect
        type: string
      approval_status:
        description: Master token authentication fields
        type: string
      awaiting_first_connect:
        description: |-
          AwaitingFirstConnect marks a WebUSB-flashed node that is approved and just
          waiting to reboot, netboot and connect for the first time.
        type: boolean
      awaiting_return_after:
        description: |-
          AwaitingReturnAfter names the slug the platform expects the node back
          from (install_os, reboot, …). Meaningful to a reader mainly while the
          node is OFFLINE: that combination is "never came back after <slug>".
        type: string
      awaiting_return_since:
        type: string
      boot_attempt_count:
        type: integer
      boot_failsafe_at:
        description: |-
          Boot-loop failsafe: BootFailsafeAt is set when the failsafe last served
          recovery (drives the "auto-recovered" badge until cleared by a healthy OS
          boot or an operator acknowledge); BootAttemptCount is the current run of
          withheld netboot attempts; BootFailsafeThreshold is the per-node override
          (nil = use the global default).
        type: integer
      boot_failsafe_threshold:
        type: integer
      boot_order:
        description: Array of boot device enums
        items:
          type: string
        type: array
      boot_to_os:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      bootloader_flashed_at:
        description: |-
          BootloaderFlashedAt is when the most recent successful EEPROM flash
          settled (unix seconds, server clock); BootloaderRebootPending says
          whether that firmware still awaits the boot that activates it. Both
          absent = unknown, and clients fail open (keep offering the update).
        type: integer
      bootloader_reboot_pending:
        type: boolean
      bootloader_timestamp:
        description: firmware build time (unix seconds)
        type: integer
      bootloader_version:
        description: Bootloader (EEPROM firmware) identity from the ROM's last HTTP-boot
          request
        type: string
      created_at:
        description: DefaultPassword is intentionally NOT included - never returned
          in API responses
        type: string
      default_username:
        description: Always include, even if empty
        type: string
      fingerprint:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.HardwareFingerprint'
      hostname:
        type: string
      id:
        type: string
      ipv4:
        type: string
      last_boot_at:
        description: |-
          LastBootAt is when the node last booted, on the SERVER's clock, derived
          from the agent's uptime rather than the device's wall clock (which a
          blank hardware RTC puts decades in the past). It rides the node_updated
          push, so a client can tell that a node has REBOOTED — not merely
          reconnected — and refresh what depends on that.
        type: integer
      last_seen_at:
        description: Unix timestamp (seconds since epoch) of last activity
        type: integer
      mac_address:
        type: string
      master_token_id:
        description: Master token used for registration (presence indicates master
          token auth)
        type: string
      name:
        type: string
      network_first:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      notes:
        description: Free-form operator notes; always include, even if empty
        type: string
      os_image_id:
        type: string
      ou_id:
        description: Organizational unit membership + per-node policy overrides (inherit|on|off)
        type: string
      pinned_by_slug:
        description: |-
          PinnedBySlug names the command that imposed a transient status, when one
          did. It answers the question "restarting" cannot: the platform pins a node
          at dispatch for any command that MIGHT take the device down, and for a
          bootloader flash that usually does not happen, so a client shows the
          alarming word only when the slug is a command that really restarts.
        type: string
      recovery_revert_pending:
        description: |-
          RecoveryRevertPending marks a one-shot reboot-to-recovery in flight:
          the node was told to netboot once and its previous boot target will be
          restored when it reconnects from the bootstrap.
        type: boolean
      ssh_key_id:
        description: SSH key ID (never password)
        type: string
      ssh_password_auth:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_organizational_unit.PolicyFlag'
      status:
        type: string
      storage_devices:
        additionalProperties:
          $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.StorageDevice'
        type: object
      system_info:
        $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_domain_node.SystemInfo'
      updated_at:
        type: string
      watchdog_disarm_reason:
        type: string
      watchdog_disarmed:
        description: |-
          Watchdog: WatchdogDisarmed is set when the agent's on-device breaker took
          the watchdog down on its own (drives the node pill until the next
          confirmed apply clears it); WatchdogDisarmReason carries the breaker's
          reason string.
        type: boolean
    type: object
