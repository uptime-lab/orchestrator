      summary: Assign a node's device profile
      tags:
      - nodes
  /api/v1/nodes/{id}/device-profile/apply:
    post:
      description: 'Dispatches apply_device_profile: ONE queueable, managed-OS-only
        command that writes the device-profile managed block into config.txt and runs
        the equipage''s typed setup steps, settling with one terminal status. Offline
        (or netbooted) nodes queue the apply for their next managed-OS connect — the
        response then carries queued=true and no command_id. Requires agent >= 0.6.0
        (fail-closed; older agents answer 400). A reboot is required afterwards and
        is never performed automatically.'
      parameters:
      - description: Node ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: command_id (when dispatched) and queued
          schema:
            allOf:
            - $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: No profile assigned / agent too old
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "404":
          description: Node not found
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
        "409":
          description: The node runs the watcher (Watcher) agent, or another command
            owns the device
          schema:
            $ref: '#/definitions/github_com_uptime-lab_orchestrator_backend_pkg_webapp_application_ports_out_results.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Apply a node's device profile
      tags:
      - nodes
  /api/v1/nodes/{id}/device-profile/preview:
    get:
      description: 'The exact config.txt managed-block content an apply would write,
        its hash, and the typed setup steps it would run — the confirm dialog''s content,
        produced by the same render the apply uses. reboot_required is always true:
        config.txt is read at boot and the platform never reboots on its own.'
