# Security headers for the SPA. Included from the server block AND
# from any location that declares its own add_header — nginx add_header
# inheritance is all-or-nothing: one add_header in a location silently drops
# every header inherited from the server block.
#
# CSP notes:
# - script-src 'self' works because the runtime config is an external
#   /config.js (startup script rewrites it), never an inline block;
# - style-src needs 'unsafe-inline': component libraries (xyflow, xterm)
#   inject <style> at runtime and React writes style attributes;
# - connect-src is 'self' ALONE, with no bare `ws: wss:` legacy-browser shim:
#   a scheme-only CSP source matches EVERY host under that scheme, so it would
#   let injected script open a WebSocket to any host while fetch/XHR stay
#   confined. These headers limit where a script can send data and what it can
#   load; they do not stop a script that does get injected from reading what
#   the page itself can read, such as tokens in browser storage. CSP3 'self' matches same-origin ws:/wss:
#   explicitly, and the WS endpoint is same-origin on every install (an
#   absolute `wss://<host>/ws` or a relative `/ws`), so the shim bought
#   nothing modern browsers need. If a browser old enough to
#   miss CSP3's rule appears, it loses live updates, not the app;
# - worker-src blob: for xterm/canvas workers;
# - usb=(self) keeps the WebUSB EEPROM flasher working; everything else in
#   Permissions-Policy is denied.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(self)" always;
add_header X-Content-Type-Options "nosniff" always;
