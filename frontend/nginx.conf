server {
    # 8080, not 80: the container runs as the unprivileged nginx user, which
    # cannot bind a privileged port. The reverse proxy forwards to this port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # No version in the Server header or on error pages.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The build's hashed assets. A missing one is a real 404, not the SPA
    # page with a 200, and the directory itself is not answered with nginx's
    # 403 page for an unlisted directory.
    location /assets/ {
        try_files $uri =404;
    }
    location = /assets/ {
        return 404;
    }

    # Runtime config is rewritten per deployment (no content hash in the name),
    # so browsers must revalidate it instead of serving a stale API/WS target.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
